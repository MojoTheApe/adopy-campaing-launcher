<section class="st-overview" aria-label="Project totals"><div class="st-metrics"><button type="button" class="st-metric" data-metric="all"><div class="st-metric-label">Total tasks</div><div class="st-metric-number">14</div><div class="st-metric-note">Across all stages · 0 archived</div></button><button type="button" class="st-metric" data-metric="backlog"><div class="st-metric-label">Backlog</div><div class="st-metric-number">4</div><div class="st-metric-note">Accepted, not scheduled</div></button><button type="button" class="st-metric" data-metric="mvp"><div class="st-metric-label">MVP remaining</div><div class="st-metric-number st-mvp-number">4</div><div class="st-metric-note">2 of 6 complete · 1 blocked</div><div class="st-meter"><span></span></div></button></div><div class="st-pipeline" id="st-pipeline"><span class="st-pipeline-label">Execution</span></div></section>
<div class="st-toolbar"><label class="st-search"><i data-lucide="search" aria-hidden="true"></i><input type="search" id="st-search" placeholder="Search tasks or IDs…" aria-label="Search tasks or IDs"></label><button type="button" class="st-control" id="st-filter-toggle" aria-expanded="false" aria-controls="st-filter-box"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span id="st-filter-label">Filters</span></button><div class="st-segment" aria-label="Task layout"><button type="button" data-layout="list" aria-pressed="true"><i data-lucide="list" aria-hidden="true"></i>List</button><button type="button" data-layout="board" aria-pressed="false"><i data-lucide="columns-3" aria-hidden="true"></i>Board</button></div>
<div class="st-filter-box" id="st-filter-box" hidden><div class="st-pophead"><h2>Filters</h2><button type="button" class="st-close" id="st-filter-close" aria-label="Close filters">×</button></div><div id="st-filter-fields"></div><button type="button" class="st-clear" data-clear="true">Clear all</button></div></div><div class="st-chips" id="st-chips"></div><div class="st-results-meta"><span id="st-result-count" aria-live="polite"></span><span id="st-order-note">Active work first</span></div><div id="st-content"></div>
</main></div><dialog class="st-detail" id="st-detail" aria-labelledby="st-detail-title"></dialog><div class="st-toast" id="st-toast" role="status" hidden></div>
<script>
(()=>{
const root=document.getElementById('signal-tracker-v2');
const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];
const stages={idea:'Idea',backlog:'Backlog',todo:'Todo',in_progress:'In progress',review:'Review',merged:'In master'};
const mods={accounts:'Accounts & Access',campaigns:'Campaigns',data:'Data & Reporting',landing:'Landing Pages & Tracking',creatives:'Creatives & Content',platform:'Platform & Operations'};
const shortMods={accounts:'Accounts',campaigns:'Campaigns',data:'Data & Reporting',landing:'Landing Pages',creatives:'Creatives',platform:'Platform'};
const tasks=[
{id:'DEMO-101',title:'Launch campaigns across multiple accounts',status:'in_progress',module:'campaigns',priority:'High',required:true,design:false,type:'Feature'},
{id:'DEMO-102',title:'Warn before publishing without a tracking link',status:'review',module:'campaigns',priority:'High',required:true,design:false,type:'Improvement'},
{id:'DEMO-103',title:'Make account setup easier to follow',status:'todo',module:'accounts',priority:'Medium',required:true,design:true,type:'Improvement'},
{id:'DEMO-104',title:'Reconcile spend between API and BI',status:'todo',module:'data',priority:'High',required:true,blocked:true,design:false,type:'Bug'},
{id:'DEMO-105',title:'Simplify the landing page QA checklist',status:'todo',module:'landing',priority:'Medium',required:false,design:true,type:'Improvement'},
{id:'DEMO-106',title:'Compare campaign performance over time',status:'backlog',module:'data',priority:'Medium',required:false,design:true,type:'Feature'},
{id:'DEMO-107',title:'Share the ad text library across machines',status:'backlog',module:'creatives',priority:'Medium',required:false,design:false,type:'Feature'},
{id:'DEMO-108',title:'Improve the installer recovery flow',status:'backlog',module:'platform',priority:'Low',required:false,design:false,type:'Improvement'},
{id:'DEMO-109',title:'Manage tracking domains in one place',status:'backlog',module:'landing',priority:'Low',required:false,design:true,type:'Feature'},
{id:'DEMO-110',title:'Generate creative briefs from winning ads',status:'idea',module:'creatives',priority:'',required:false,design:false,type:'Research'},
{id:'DEMO-111',title:'Send account alerts to the team chat',status:'idea',module:'accounts',priority:'',required:false,design:false,type:'Feature'},
{id:'DEMO-112',title:'Keep date ranges consistent across reports',status:'merged',module:'data',priority:'Medium',required:true,design:false,type:'Bug'},
{id:'DEMO-113',title:'Show a clear account health summary',status:'merged',module:'accounts',priority:'Medium',required:true,design:true,type:'Feature'},
{id:'DEMO-114',title:'Keep task data visible when sync is delayed',status:'merged',module:'platform',priority:'Medium',required:false,design:false,type:'Bug'}];
const state={view:'all',module:'',query:'',layout:'list',status:[],priority:[],type:[],design:false,required:false,blocked:false,remaining:false,column:'in_progress',theme:'system'};
const design={accent:'cobalt',signal:true,density:'comfortable'};
const views={all:'All tasks',work:'Work',plan:'Plan',mvp:'MVP',archive:'Archive'};
const viewIcons={all:'layers',work:'circle-play',plan:'inbox',mvp:'flag',archive:'archive'};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stage=s=>`<span class="st-stage" data-status="${s}"><span class="st-stage-dot"></span>${stages[s]}</span>`;
const copy=id=>`<button type="button" class="st-copy" data-copy="${id}" aria-label="Copy task ID ${id}" data-tooltip="Copy task ID"><i data-lucide="copy" aria-hidden="true"></i></button>`;
const title=t=>`<button type="button" class="st-task-title" data-task="${t.id}">${esc(t.title)}</button>`;
const idline=t=>`<div class="st-idline"><span class="st-id">${t.id}</span>${copy(t.id)}${t.blocked?'<span class="st-blocked">Blocked</span>':''}${t.design?'<span class="st-design-mark">Design</span>':''}${t.required?'<span class="st-mobile-mvp">MVP</span>':''}</div>`;
function base(){return tasks.filter(t=>state.view==='all'||state.view==='work'&&['todo','in_progress','review'].includes(t.status)||state.view==='plan'&&['idea','backlog'].includes(t.status)||state.view==='mvp'&&t.required)}
function filtered(){return base().filter(t=>(!state.module||t.module===state.module)&&(!state.query||`${t.id} ${t.title} ${mods[t.module]}`.toLowerCase().includes(state.query.toLowerCase()))&&(!state.status.length||state.status.includes(t.status))&&(!state.priority.length||state.priority.includes(t.priority))&&(!state.type.length||state.type.includes(t.type))&&(!state.design||t.design)&&(!state.required||t.required)&&(!state.blocked||t.blocked)&&(!state.remaining||t.status!=='merged'))}
function clear(){state.module='';state.query='';state.status=[];state.priority=[];state.type=[];state.design=false;state.required=false;state.blocked=false;state.remaining=false;$('#st-search').value=''}
function chooseView(v){clear();state.view=v;render()}
function iconRefresh(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})}
function renderNav(){
 const nav=Object.entries(views).map(([v,label])=>`<button type="button" data-view="${v}" aria-pressed="${state.view===v}"><i data-lucide="${viewIcons[v]}" aria-hidden="true"></i>${label}${v==='all'?'<span class="st-nav-count">14</span>':v==='work'?'<span class="st-nav-count">5</span>':''}</button>`).join('');$('#st-views').innerHTML=nav;$('#st-mobile-nav').innerHTML=nav;
 $('#st-modules').innerHTML=`<button type="button" data-module="" aria-pressed="${!state.module}"><span class="st-module-dot"></span>All modules</button>`+Object.entries(mods).map(([m,l])=>`<button type="button" data-module="${m}" aria-pressed="${state.module===m}"><span class="st-module-dot"></span>${l}</button>`).join('');
 $('#st-heading').textContent=views[state.view];
}
function renderFilters(){
 const fields=[['Status','status',Object.entries(stages)],['Priority','priority',['High','Medium','Low'].map(x=>[x,x])],['Type','type',['Bug','Feature','Improvement','Research'].map(x=>[x,x])]];
 $('#st-filter-fields').innerHTML=fields.map(([label,key,options])=>`<fieldset><legend>${label}</legend><div class="st-options">${options.map(([v,l])=>`<label><input type="checkbox" data-facet="${key}" value="${v}" ${state[key].includes(v)?'checked':''}>${l}</label>`).join('')}</div></fieldset>`).join('')+`<fieldset><legend>Focus</legend><div class="st-options">${['design','required','blocked'].map(k=>`<label><input type="checkbox" data-flag="${k}" ${state[k]?'checked':''}>${{design:'Design',required:'MVP required',blocked:'Blocked'}[k]}</label>`).join('')}</div></fieldset><fieldset class="st-mobile-modules" style="display:none"><legend>Module</legend><div class="st-options">${Object.entries(shortMods).map(([m,l])=>`<label><input type="radio" name="st-module" value="${m}" data-module-input="true" ${state.module===m?'checked':''}>${l}</label>`).join('')}</div></fieldset>`;
 const chips=[];if(state.module)chips.push(['module',state.module,mods[state.module]]);if(state.query)chips.push(['query',state.query,`Search: ${state.query}`]);for(const k of ['status','priority','type'])for(const v of state[k])chips.push([k,v,stages[v]||v]);for(const k of ['design','required','blocked','remaining'])if(state[k])chips.push([k,'',({design:'Design',required:'MVP required',blocked:'Blocked',remaining:'Incomplete'})[k]]);
 $('#st-chips').innerHTML=chips.map(([k,v,l])=>`<button type="button" class="st-chip" data-remove="${k}" data-value="${esc(v)}" aria-label="Remove ${esc(l)} filter">${esc(l)} <span aria-hidden="true">×</span></button>`).join('')+(chips.length?'<button type="button" class="st-clear" data-clear="true">Clear all</button>':'');
 const n=state.status.length+state.priority.length+state.type.length+Number(state.design)+Number(state.required)+Number(state.blocked)+Number(state.remaining);$('#st-filter-label').textContent=n?`Filters (${n})`:'Filters';
}
function listMarkup(rows){return `<div class="st-list"><div class="st-list-head"><span>Task</span><span>Status</span><span class="st-module-head">Module</span><span class="st-priority-head">Priority</span><span>Release</span></div>${rows.map(t=>`<div class="st-row"><div class="st-task-main">${idline(t)}${title(t)}</div>${stage(t.status)}<span class="st-module">${shortMods[t.module]}</span><span class="st-priority" data-priority="${t.priority.toLowerCase()}">${t.priority||'—'}</span>${t.required?'<span class="st-release">MVP</span>':'<span class="st-release-empty"></span>'}</div>`).join('')}</div>`}
let lastWidthBucket='';
function boardMarkup(rows){let columns=state.view==='work'?['todo','in_progress','review']:state.view==='plan'?['idea','backlog']:Object.keys(stages);if(state.status.length)columns=columns.filter(s=>state.status.includes(s));const width=$('#st-content').clientWidth;const focused=width<columns.length*246;let shown=columns;let nav='';if(focused){if(!columns.includes(state.column))state.column=columns.find(s=>rows.some(t=>t.status===s))||columns[0];shown=[state.column];nav=`<div class="st-board-nav" aria-label="Focus column">${columns.map(s=>`<button type="button" data-column="${s}" aria-pressed="${s===state.column}">${stages[s]} · ${rows.filter(t=>t.status===s).length}</button>`).join('')}</div>`;$('#st-order-note').textContent='Focus column';}else $('#st-order-note').textContent='Grouped by status';
 return nav+`<div class="st-board" style="--st-columns:${shown.length}">${shown.map(s=>`<section class="st-lane" aria-label="${stages[s]}"><div class="st-lane-head">${stage(s)}<b>${rows.filter(t=>t.status===s).length}</b></div>${rows.filter(t=>t.status===s).map(t=>`<article class="st-board-card">${idline(t)}${title(t)}<div class="st-card-bottom"><span class="st-module">${shortMods[t.module]}</span>${t.required?'<span class="st-release">MVP</span>':`<span class="st-priority">${t.priority||'Idea'}</span>`}</div></article>`).join('')||'<div class="st-lane-empty">No tasks in this stage</div>'}</section>`).join('')}</div>`}
function renderContent(){const rows=filtered();$('#st-result-count').textContent=`Showing ${rows.length} of ${base().length} tasks · sample data`;$('#st-order-note').textContent='Active work first';$('#st-content').innerHTML=!rows.length?`<div class="st-empty">${state.view==='archive'?'No archived tasks in this preview':'No tasks match these filters'}${state.view!=='archive'?'<br><button type="button" class="st-clear" data-clear="true">Clear filters</button>':''}</div>`:state.layout==='list'?listMarkup(rows):boardMarkup(rows);iconRefresh()}
function render(){root.dataset.accent=design.accent;root.dataset.signal=String(design.signal);root.dataset.density=design.density;renderNav();renderFilters();renderContent();$$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===state.layout)))}
$('#st-pipeline').insertAdjacentHTML('beforeend',['todo','in_progress','review','merged'].map(s=>`<button type="button" data-metric="${s}"><span class="st-stage-dot" data-status="${s}"></span>${stages[s]}<b>${tasks.filter(t=>t.status===s).length}</b></button>`).join(''));
function filterClose(){const box=$('#st-filter-box');if(!box.hidden){box.hidden=true;$('#st-filter-toggle').setAttribute('aria-expanded','false');$('#st-filter-toggle').focus()}}
let opener=null;function details(id,button){const t=tasks.find(t=>t.id===id);if(!t)return;opener=button;const d=$('#st-detail');d.innerHTML=`<div class="st-detail-close"><div class="st-idline"><span class="st-id">${id}</span>${copy(id)}</div><button type="button" class="st-close" data-close-detail="true" aria-label="Close task details">×</button></div>${stage(t.status)}<h2 id="st-detail-title">${esc(t.title)}</h2><dl><dt>Module</dt><dd>${mods[t.module]}</dd><dt>Priority</dt><dd>${t.priority||'Not set'}</dd><dt>Release</dt><dd>${t.required?'MVP · Required':'Not assigned'}</dd><dt>Type</dt><dd>${t.type}${t.design?' · Design':''}</dd></dl><h3>Outcome</h3><p>${t.id==='DEMO-101'?'Prepare one campaign across selected accounts, with a clear review of each account before publishing.':`Deliver a clear, verifiable result for “${esc(t.title.toLowerCase())}”.`}</p><h3>Acceptance criteria</h3><ul><li>The intended result is visible and easy to verify.</li><li>Existing settings and task context are preserved.</li><li>All changes are reviewed before the final merge.</li></ul>${t.blocked?'<h3>Blocked</h3><p>Waiting for the reporting contract to be confirmed.</p>':''}<div class="st-detail-note">Design preview · synthetic task<br>Status changes are made through GitHub by the agent.</div>`;if(root.clientWidth>=1700)d.show();else d.showModal();iconRefresh();d.querySelector('[data-close-detail]').focus()}
let toastTimer;function toast(msg){clearTimeout(toastTimer);$('#st-toast').textContent=msg;$('#st-toast').hidden=false;toastTimer=setTimeout(()=>$('#st-toast').hidden=true,3000)}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
 if(b.dataset.copy){const value=b.dataset.copy;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>toast(`Copied ${value}`)).catch(()=>toast(`Copy manually: ${value}`))}else toast(`Copy manually: ${value}`);return}
 if(b.dataset.task){details(b.dataset.task,b);return}
 if(b.dataset.closeDetail){$('#st-detail').close();return}
 if(b.dataset.view){chooseView(b.dataset.view);return}
 if(Object.hasOwn(b.dataset,'module')){state.module=b.dataset.module;render();return}
 if(b.dataset.layout){state.layout=b.dataset.layout;render();return}
 if(b.dataset.column){state.column=b.dataset.column;renderContent();return}
 if(b.dataset.theme){state.theme=b.dataset.theme;root.classList.add('st-theme-transition');if(state.theme==='system')delete root.dataset.theme;else root.dataset.theme=state.theme;$$('.st-theme button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.theme===state.theme)));setTimeout(()=>root.classList.remove('st-theme-transition'),200);return}
 if(b.dataset.metric){clear();state.view=b.dataset.metric==='mvp'?'mvp':'all';if(b.dataset.metric==='mvp')state.remaining=true;else if(b.dataset.metric!=='all')state.status=[b.dataset.metric];render();return}
 if(b.dataset.clear){clear();render();return}
 if(b.dataset.remove){const k=b.dataset.remove;if(Array.isArray(state[k]))state[k]=state[k].filter(x=>x!==b.dataset.value);else state[k]=typeof state[k]==='boolean'?false:'';if(k==='query')$('#st-search').value='';render();return}
 if(b.id==='st-filter-toggle'){const box=$('#st-filter-box');box.hidden=!box.hidden;b.setAttribute('aria-expanded',String(!box.hidden));if(!box.hidden)$('#st-filter-close').focus();return}
 if(b.id==='st-filter-close')filterClose();
});
$('#st-detail').addEventListener('close',()=>{if(opener?.isConnected)opener.focus()});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#st-detail').open){$('#st-detail').close();e.preventDefault()}else filterClose()}});
root.addEventListener('pointerdown',e=>{if(!$('#st-filter-box').hidden&&!$('#st-filter-box').contains(e.target)&&!$('#st-filter-toggle').contains(e.target))filterClose()});
root.addEventListener('change',e=>{const i=e.target;if(i.dataset.facet){const k=i.dataset.facet;state[k]=i.checked?[...state[k],i.value]:state[k].filter(x=>x!==i.value)}else if(i.dataset.flag)state[i.dataset.flag]=i.checked;else if(i.dataset.moduleInput)state.module=i.value;else return;renderContent();const keep={facet:i.dataset.facet,flag:i.dataset.flag,value:i.value,module:i.dataset.moduleInput};renderFilters();const next=$$('#st-filter-fields input').find(x=>x.dataset.facet===keep.facet&&x.dataset.flag===keep.flag&&x.value===keep.value&&x.dataset.moduleInput===keep.module);next?.focus();renderNav()});
$('#st-search').addEventListener('input',e=>{state.query=e.target.value;renderFilters();renderContent()});
render();
new ResizeObserver(()=>{const width=$('#st-content').clientWidth;const bucket=Math.floor(width/20);if(bucket!==lastWidthBucket){lastWidthBucket=bucket;if(state.layout==='board')renderContent()}}).observe($('#st-content'));
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'accent',{label:'Primary accent',options:[{label:'Cobalt',value:'cobalt'},{label:'Teal',value:'teal'}]});tweak.addToggle(design,'signal',{label:'Subtle RGB accent'});tweak.addSelect(design,'density',{label:'Row density',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]})}
})();
</script>
</div>
