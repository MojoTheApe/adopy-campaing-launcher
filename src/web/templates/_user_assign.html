{# ACL-2900: назначение аккаунтов пользователю. Рисуется только там, где есть ключ владельца
   хаба (user_assign_enabled); логика — /static/user_assign.js, стили — классы amap-*. #}
<details class="amap-assign" id="ua-root">
  <summary><h3 style="display:inline">Assign accounts to a user</h3></summary>
  <div class="amap-add" style="flex-wrap:wrap">
    <select id="ua-user" aria-label="User"><option value="">Pick a user…</option></select>
    <input type="email" id="ua-email" placeholder="or type a new email" size="26" autocomplete="off" spellcheck="false">
    <span class="amap-msg" id="ua-msg" role="status"></span>
  </div>
  <div class="amap-add" style="flex-wrap:wrap;align-items:flex-start">
    <textarea id="ua-text" rows="6" cols="60" spellcheck="false"
      placeholder="One per line: account name, ad account number, act_123… or an Ads Manager link"></textarea>
    <span style="display:flex;flex-direction:column;gap:0.4rem">
      <button type="button" class="amap-btn" id="ua-check">Check</button>
      <button type="button" class="amap-btn" id="ua-send">Assign</button>
    </span>
  </div>
  <div id="ua-results" class="ua-results"></div>
</details>
