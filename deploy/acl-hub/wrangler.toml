# Хаб телеметрии ACL (часть 1): приём событий машин в D1 и выводы. Развёртывание — README.md.
name = "acl-hub"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
LIBRARY_REPO = "MojoTheApe/acl-lib"
HUB_URL = "https://acl-hub.acl-hub.workers.dev"

# Каждые 5 мин — зависшие задания; 05:00 UTC (07:00 Израиль зимой) — дайджест за вчера.
[triggers]
crons = ["*/5 * * * *", "0 5 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "acl_hub"
# Подставить id, который напечатает `wrangler d1 create acl_hub`.
database_id = "75b520a8-b3aa-4396-8b8d-23a6fc2016d6"
migrations_dir = "migrations"

# Секреты (только `wrangler secret put`, в файл не писать): OWNER_KEY, TG_BOT_TOKEN, TG_WEBHOOK_SECRET,
# TG_ALLOWED_CHATS (id чатов через запятую).
