services:
  tracker:
    image: ${TRACKER_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./.local/users:/etc/nginx/tracker-users:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    labels:
      - traefik.enable=true
      - traefik.http.routers.acl-tracker.rule=Host(`tracker.team7.cloud`)
      - traefik.http.routers.acl-tracker.entrypoints=websecure
      - traefik.http.routers.acl-tracker.tls=true
      - traefik.http.routers.acl-tracker.tls.certresolver=letsencrypt
      - traefik.http.services.acl-tracker.loadbalancer.server.port=8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
