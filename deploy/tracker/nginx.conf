server {
    listen 8080;
    server_name tracker.team7.cloud;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    auth_basic "Team7 task tracker";
    auth_basic_user_file /etc/nginx/tracker-users;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
