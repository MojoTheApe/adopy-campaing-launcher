# Forbidden click / navigation zones for Agent 10 campaign-open (phase A).
# How to extend: send a screenshot → append pattern + evidence; update skill cheat sheet.
version: 1

bad_url_patterns:
  - /business/news/
  - /business/help/
  - click-attribution
  - /business/helpcenter/

# own_text / aria-label / link text matched against recipe click targets
# and against resolved locator text before clicking.
forbidden_click_texts:
  - pattern: "(?i)^About this update$"
    reason: exits Ads Manager to measurement news (click-attribution)
    evidence: 20260717_142747_player_wizard_tab_not_found.png
  - pattern: "(?i)^About (daily budget|campaign budget|campaign objectives)$"
    reason: help links leave Ads Manager / open help
    evidence: 20260717_144348_player_campaign.png
  - pattern: "(?i)^Learn more$"
    reason: often opens help/news in same tab
  - pattern: "(?i)^(Close|Cerrar)$"
    reason: closes wizard chrome (draft dialog Cancel is allowed separately)
    scope: wizard_chrome
  - pattern: "(?i)^Discard drafts?$"
    reason: destroys drafts / leaves create flow
  - pattern: "(?i)^Review and publish"
    reason: leaves edit flow toward publish review
  - pattern: "(?i)^Publish$"
    reason: publishes the campaign live — never automatic, only on explicit ACTIVE + confirmed publish

# Never block these recipe intents even if text overlaps a soft rule.
allowed_click_texts:
  - "(?i)^(Create|Continue|Next|Leads|Manual campaign setup|Website|Single|Cancel|Cancelar)$"

# Soft: if URL matches, recover (history.back → reopen draft). Max attempts per run.
recover:
  # News → manage list without edit wizard counts as failure; reopen needs a second try.
  max_attempts: 3
  prefer_close_news_tab: true

# ACL-1613: words the AI rescue module (src/fb_ads_rpa/ai_rescue.py) never acts on. One table for
# EN / ES / PT. Patterns are matched on NORMALISED text (lower case, accents stripped, every
# non-letter/digit run turned into one space) with word boundaries added by the code, so write them
# in plain ascii lower case. `context` is checked against the target's label sources, the text next
# to it and the FULL text of the dialog around it; `target_only` only against the target's own
# label sources (it would otherwise block every harmless button inside an "Edit ..." dialog).
ai_rescue:
  context:
    - {lang: en, reason: publish, pattern: "publish(?:ed|ing)?"}
    - {lang: en, reason: delete, pattern: "delete"}
    - {lang: en, reason: remove, pattern: "remove"}
    - {lang: en, reason: discard, pattern: "discard"}
    - {lang: en, reason: terms_accept, pattern: "accept|agree|terms"}
    - {lang: en, reason: lead_form, pattern: "(?:create|new|add) (?:a )?(?:lead |instant )?forms?|instant forms?"}
    - {lang: en, reason: logout, pattern: "log ?out|sign ?out"}
    - {lang: en, reason: payment, pattern: "payments?|billing|credit card|debit card"}
    - {lang: en, reason: leave_unsaved, pattern: "close without saving|leave|don t save"}
    - {lang: es, reason: publish, pattern: "publicar|publicado"}
    - {lang: es, reason: delete, pattern: "eliminar|borrar|quitar"}
    - {lang: es, reason: discard, pattern: "descartar"}
    - {lang: es, reason: terms_accept, pattern: "aceptar|acepto|terminos|condiciones"}
    - {lang: es, reason: lead_form, pattern: "formularios? instantaneos?|(?:crear|nuevo|anadir|agregar) formulario"}
    - {lang: es, reason: logout, pattern: "cerrar sesion"}
    - {lang: es, reason: payment, pattern: "pagos?|facturacion|metodo de pago"}
    - {lang: es, reason: leave_unsaved, pattern: "salir"}
    - {lang: pt, reason: publish, pattern: "publicar|publicado"}
    - {lang: pt, reason: delete, pattern: "excluir|remover|apagar"}
    - {lang: pt, reason: discard, pattern: "descartar"}
    - {lang: pt, reason: terms_accept, pattern: "aceitar|concordar|concordo|termos"}
    - {lang: pt, reason: lead_form, pattern: "formularios? instantaneos?|(?:criar|novo|adicionar) formulario"}
    - {lang: pt, reason: logout, pattern: "encerrar sessao|sair da conta"}
    - {lang: pt, reason: payment, pattern: "pagamentos?|cobranca|faturamento|forma de pagamento|cartao de credito"}
    - {lang: pt, reason: leave_unsaved, pattern: "sair"}
  target_only:
    - {lang: en, reason: duplicate, pattern: "duplicate"}
    - {lang: en, reason: edit, pattern: "edit"}
    - {lang: en, reason: toggle, pattern: "on off|turn on|turn off|switch on|switch off"}
    - {lang: es, reason: duplicate, pattern: "duplicar"}
    - {lang: es, reason: edit, pattern: "editar"}
    - {lang: es, reason: toggle, pattern: "activar|desactivar|encender"}
    - {lang: pt, reason: duplicate, pattern: "duplicar"}
    - {lang: pt, reason: edit, pattern: "editar"}
    - {lang: pt, reason: toggle, pattern: "ativar|desativar|ligar|desligar"}
  # A target whose label sources are ALL in this list is a "close" button: allowed only for
  # close_dialog inside a visible dialog, refused for every other action.
  close_labels: [close, cerrar, cancel, cancelar, not now, ahora no, dismiss, fechar, agora nao, x, no thanks]
