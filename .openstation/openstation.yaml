project:
  name: fb_agents
  alias: fb
hooks:
  StatusTransition:
  - matcher: '*→ready'
    command: bin/hooks/auto-start
    phase: post
    timeout: 30
  - matcher: '*→review'
    command: bin/hooks/auto-verify
    phase: post
    timeout: 30
  - matcher: '*→verified'
    command: bin/hooks/auto-accept
    phase: post
    timeout: 30
    enabled: false
  - matcher: '*→done'
    command: bin/hooks/auto-commit
    phase: post
    timeout: 120
  - matcher: in-progress→ready
    command: bin/hooks/suspend
    phase: post
    timeout: 120
  - matcher: in-progress→backlog
    command: bin/hooks/suspend
    phase: post
    timeout: 120
  RunComplete:
  - command: bin/hooks/run-complete
    phase: post
    timeout: 300
autonomous:
  enabled: true
run:
  detached_backend: tmux
  tmux:
    mode: window
    target_session: fb
defaults:
  show:
    editor: true
