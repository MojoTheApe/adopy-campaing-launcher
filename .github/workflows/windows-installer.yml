name: Windows installer isolation

on:
  push:
    branches:
      - codex/acl-windows-installer-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-1-isolation:
    name: Frozen pilot isolation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify installer branch isolation
        run: python packaging/windows/verify_core_isolation.py --tracked-only

      - name: Scan tracked release inputs for secrets and account identifiers
        run: python scripts/acl_scan_secrets.py

      - name: Test the isolation guard
        run: python -m unittest discover -s packaging/windows/tests -p "test_*.py" -v

      - name: Compile packaging tools
        run: python -m compileall -q packaging/windows

  phase-2-packaging-spike:
    name: Build, install, repair, and uninstall
    needs: phase-1-isolation
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ACL_PACKAGE_VERSION: 0.1.0-alpha.${{ github.run_number }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frozen runtime and packager
        run: python -m pip install -r requirements.txt PyInstaller==6.22.2

      - name: Build onedir bundle
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version "$env:ACL_PACKAGE_VERSION"

      - name: Test the packaged executable
        shell: pwsh
        run: ./packaging/windows/test_bundle.ps1

      - name: Build per-user Windows installer
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1 -Version "$env:ACL_PACKAGE_VERSION"

      - name: Test install, launch, repair, and uninstall
        shell: pwsh
        run: ./packaging/windows/test_installer.ps1 -Version "$env:ACL_PACKAGE_VERSION"

      - name: Create downloadable archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path packaging/windows/.artifacts/dist/ACL `
            -DestinationPath packaging/windows/.artifacts/ACL-Windows-spike.zip

      - name: Upload packaging spike
        uses: actions/upload-artifact@v4
        with:
          name: ACL-Windows-spike-${{ github.run_number }}
          path: |
            packaging/windows/.artifacts/ACL-Windows-spike.zip
            packaging/windows/.artifacts/installer/ACL-Setup-*.exe
            packaging/windows/.build/acl-build-manifest.json
            packaging/windows/.build/current.json
            packaging/windows/.artifacts/test-logs/
            packaging/windows/.artifacts/installer-test-logs/
          if-no-files-found: error
          retention-days: 14
