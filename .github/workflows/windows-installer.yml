name: Windows installer

on:
  push:
    branches:
      - master
      - main
      - stage
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acl-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify installer changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/acl_ci_scope.py
  phase-1-isolation:
    name: Verify build inputs
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.windows != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify installer branch isolation
        run: python packaging/windows/verify_core_isolation.py --tracked-only --require-clean

      - name: Scan tracked release inputs for secrets and account identifiers
        run: python scripts/acl_scan_secrets.py

      - name: Install dependencies for packaging behavior tests
        run: python -m pip install -r requirements.txt

      - name: Test the isolation guard
        run: python -m unittest discover -s packaging/windows/tests -p "test_*.py" -v

      - name: Compile packaging tools
        run: python -m compileall -q packaging/windows

  phase-2-packaging-spike:
    name: Build, install, repair, and uninstall
    needs: phase-1-isolation
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ACL_NO_TELEMETRY: "1"
      PYTHONIOENCODING: utf-8
      ACL_PACKAGE_VERSION: 0.1.0-alpha.${{ github.run_number }}
      ACL_TEST_PREVIOUS_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and packager
        run: python -m pip install -r requirements.txt PyInstaller==6.22.2

      - name: Test setup with runtime dependencies
        run: |
          python -m unittest discover -s packaging/windows/tests -p "test_machine_config.py" -v
          python -m unittest discover -s packaging/windows/tests -p "test_setup_wizard.py" -v

      - name: Build previous isolated test package from the candidate source
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 -Version "$env:ACL_TEST_PREVIOUS_VERSION"
          ./packaging/windows/build_installer.ps1 -Version "$env:ACL_TEST_PREVIOUS_VERSION"

      - name: Build onedir bundle
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version "$env:ACL_PACKAGE_VERSION"

      - name: Test the packaged executable
        shell: pwsh
        run: ./packaging/windows/test_bundle.ps1

      - name: Build per-user Windows installer
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1 -Version "$env:ACL_PACKAGE_VERSION"

      - name: Test install, launch, repair, and uninstall
        shell: pwsh
        run: ./packaging/windows/test_installer.ps1 -Version "$env:ACL_PACKAGE_VERSION"

      - name: Test real package update, restart, and recovery
        shell: pwsh
        run: |
          python packaging/windows/test_update_cycle.py --old-version "$env:ACL_TEST_PREVIOUS_VERSION" --version "$env:ACL_PACKAGE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Real package update/recovery acceptance failed." }

      - name: Keep update and recovery evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ACL-update-recovery-${{ github.run_number }}
          path: packaging/windows/.artifacts/update-cycle-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Create downloadable archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path packaging/windows/.artifacts/dist/ACL `
            -DestinationPath packaging/windows/.artifacts/ACL-Windows-spike.zip

      - name: Upload Windows preview and test logs
        uses: actions/upload-artifact@v4
        with:
          name: ACL-Windows-spike-${{ github.run_number }}
          path: |
            packaging/windows/.artifacts/ACL-Windows-spike.zip
            packaging/windows/.artifacts/installer/Adopy-Campaign-Launcher-Setup-*.exe
            packaging/windows/.build/acl-build-manifest.json
            packaging/windows/.build/current.json
            packaging/windows/.artifacts/test-logs/
            packaging/windows/.artifacts/installer-test-logs/
          if-no-files-found: error
          retention-days: 14

  admission:
    name: Installer verification
    if: ${{ always() }}
    needs: [scope, phase-1-isolation, phase-2-packaging-spike]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable packaging check
        env:
          SCOPE: ${{ needs.scope.result }}
          WINDOWS: ${{ needs.scope.outputs.windows }}
          INPUTS: ${{ needs.phase-1-isolation.result }}
          INSTALLER: ${{ needs.phase-2-packaging-spike.result }}
        run: |
          test "$SCOPE" = success
          if test "$WINDOWS" = false; then
            test "$INPUTS" = skipped
            test "$INSTALLER" = skipped
          else
            test "$WINDOWS" = true
            test "$INPUTS" = success
            test "$INSTALLER" = success
          fi
