name: Delivery setup (draft adoption)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: MojoTheApe/master-repo@e1473c428872757519355af1a7753cf3a0ce0f12
        with:
          allow-draft: 'true'
