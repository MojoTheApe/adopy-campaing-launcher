name: Delivery setup (draft adoption)
on:
  # ACL-1649: a branch push with an open PR ran this twice (push + pull_request); the PR run covers it.
  push:
    branches: [master, main, stage]
  pull_request:
permissions:
  contents: read
jobs:
  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: MojoTheApe/master-repo@d24db185ebdff2cadcecf89f5b28061d6cd19564
        with:
          allow-draft: 'true'
