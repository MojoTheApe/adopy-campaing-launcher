name: Delivery setup
on:
  push:
    branches: [master, main, stage]
  pull_request:
permissions:
  contents: read
concurrency:
  group: delivery-setup-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch immutable official provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MojoTheApe/task-tracker
          ref: 771d55f3317397e7d56471aa966f0a9de37d1a2e
          path: trusted/provider
          ssh-key: ${{ secrets.TRACKER_PROVIDER_READ_KEY }}
          ssh-strict: true
          persist-credentials: false
      - name: Fetch consumer as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trusted/consumer
          persist-credentials: false
      - name: Validate consumer with official provider
        shell: bash
        run: python3 -I trusted/provider/scripts/workflow_provider.py validate --root trusted/consumer --allow-draft
