# Runs the test suite on Windows, which is the only OS ACL runs on.
#
# There was no build at all until 2026-08-30, and it showed: 19 of 212 tests
# were failing, some for weeks. They described a dashboard that had been
# redesigned around them, and hidden among them were two real defects nobody
# had seen — a validation panel that could never display, and an account patch
# that rejected a field the caller had not sent. Tests nothing runs do not
# protect anything; they rot quietly and take real failures down with them.
#
# Windows on purpose: ACL is a Playwright + Multilogin tool on buyers' Windows
# machines, and path handling, CRLF and %LOCALAPPDATA% are exactly where this
# code goes wrong. A green Linux build would be reassurance about a platform
# nobody uses.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # flow_version reads the tag distance and the commit, so the shallow
          # clone Actions makes by default would give it nothing to describe.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Same check the launcher runs before it lets a new version become the
      # installed one, so CI fails on exactly what would block a buyer's update.
      # No browsers are installed: this imports Playwright, it does not drive it.
      - name: Smoke check (does ACL start?)
        run: python scripts/acl_smoke.py

      - name: Tests
        run: python -m pytest tests/ -q
