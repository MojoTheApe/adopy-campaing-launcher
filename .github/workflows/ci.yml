# Runs the test suite on Windows, which is the only OS ACL runs on.
#
# There was no build at all until 2026-08-30, and it showed: 19 of 212 tests
# were failing, some for weeks. They described a dashboard that had been
# redesigned around them, and hidden among them were two real defects nobody
# had seen — a validation panel that could never display, and an account patch
# that rejected a field the caller had not sent. Tests nothing runs do not
# protect anything; they rot quietly and take real failures down with them.
#
# Windows on purpose: ACL is a Playwright + Multilogin tool on buyers' Windows
# machines, and path handling, CRLF and %LOCALAPPDATA% are exactly where this
# code goes wrong. A green Linux build would be reassurance about a platform
# nobody uses.
name: CI

on:
  push:
    branches: [master, main, stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # ACL-1565: the scope job reads earlier runs of this workflow to reuse a full
  # green run of the exact same git tree (scripts/acl_ci_reuse.py).
  actions: read

concurrency:
  group: acl-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify and check project tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      reused_from: ${{ steps.scope.outputs.reused_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # windows=false also when this exact tree already passed a full push run
      # (promotion stage -> main); release tags and manual runs always run in full.
      - id: scope
        run: python3 scripts/acl_ci_scope.py --workflow ci.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scan all tracked inputs
        run: python3 scripts/acl_scan_secrets.py
      - name: Install lightweight test dependencies
        run: python3 -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Verify project tooling and tracker metadata
        run: |
          python3 -m json.tool tracker/config.json > /dev/null
          python3 -m json.tool tracker/engine.json > /dev/null
          python3 -m pytest --noconftest tests/test_acl_ci_scope.py tests/test_acl_ci_reuse.py tests/test_acl_tracker.py tests/test_tracker_v2.py tests/test_master_adoption.py -q
  test:
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.windows != 'false') }}
    runs-on: windows-latest
    # 2026-09-27: the suite passed 3300 tests and runs ~19-20 min on the hosted
    # runner (3.13: 19m13s; 3.11 was cancelled at 20m16s on PR #328). Keep headroom.
    timeout-minutes: 35

    # Belt and braces alongside scripts/_console.py: the runner's console is not
    # UTF-8, and a Russian line printed by any step would abort it.
    env:
      PYTHONIOENCODING: utf-8

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        # ACL-1397: the suite is split into 3 jobs per Python version
        # (scripts/acl_test_shard.py). A private repository's hosted Windows
        # runner has 2 CPUs, so pytest-xdist alone did not shorten CI; three
        # runners do. Together the shards are exactly tests/test_*.py.
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4
        with:
          # flow_version reads the tag distance and the commit, so the shallow
          # clone Actions makes by default would give it nothing to describe.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Same check the launcher runs before it lets a new version become the
      # installed one, so CI fails on exactly what would block a buyer's update.
      # Runtime still attaches to Multilogin; Chromium below is only for
      # isolated tests of recorded/synthetic DOM fixtures.
      # ACL is pushed to a repository outside developers read and copied onto
      # every buyer's machine, so the tree must not carry credentials or the
      # identifiers saying which real ad accounts anyone works in. First run of
      # this found live cabinets in two handoff docs and in a docstring.
      - name: Data and secret scan
        run: python scripts/acl_scan_secrets.py

      - name: Smoke check (does ACL start?)
        run: python scripts/acl_smoke.py

      - name: Install Chromium for isolated DOM tests
        run: python -m playwright install chromium

      # Parallel since ACL-1397: this job's shard of the test files, with one
      # pytest-xdist worker per runner CPU. `loadfile` keeps each test file on
      # one worker: 80+ files launch their own Chromium in a module fixture,
      # and spreading a file's tests over workers launched that browser once
      # per worker (measured locally: 41 min with test-by-test `load` vs
      # 20 min with `loadfile`). See docs/repository/WORKFLOW.md.
      - name: Tests (shard ${{ matrix.shard }} of 3)
        run: |
          Write-Output "CPUs on this runner: $env:NUMBER_OF_PROCESSORS"
          $files = @(python scripts/acl_test_shard.py ${{ matrix.shard }} 3)
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw "no test files for shard ${{ matrix.shard }}" }
          Write-Output "$($files.Count) test files in this shard"
          python -m pytest @files -q -n auto --dist loadfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  admission:
    name: ACL verification
    if: ${{ always() }}
    needs: [scope, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          SCOPE: ${{ needs.scope.result }}
          WINDOWS: ${{ needs.scope.outputs.windows }}
          REUSED: ${{ needs.scope.outputs.reused_from }}
          TESTS: ${{ needs.test.result }}
        run: |
          test "$SCOPE" = success
          if test -n "$REUSED"; then echo "Reused full results of run $REUSED (same tree)"; fi
          if test "$WINDOWS" = false; then
            test "$TESTS" = skipped
          else
            test "$WINDOWS" = true
            test "$TESTS" = success
          fi
