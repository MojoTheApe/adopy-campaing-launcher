name: Task or idea
description: Capture an idea or a concrete outcome
labels: ["status:idea", "flag:needs_classification"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what changes, why it matters and the expected result in plain English. A reader should understand the task without the original chat.
      placeholder: "Write a short explanation in your own words. Keep implementation details in Technical notes below."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks; an idea can be refined before it enters Todo.
  - type: textarea
    id: dependencies
    attributes:
      label: Technical notes
      description: Use needs followed by a colon and an issue reference for each dependency. Include useful context and links.
  - type: markdown
    attributes:
      value: "The agent writes Description from the request and verified context even if the owner did not dictate it. Do not invent missing requirements. An agent classifies the module and type from tracker/config.json. Priority is High / Medium / Low; accepted work defaults to Medium. Release is one explicit flag; ask the agent to add the task to Release. IDs are assigned automatically. New functional modules may be added with documented boundaries and examples."
